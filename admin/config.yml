# To enable the rich CMS editor (drag-and-drop, image uploads),
# register a GitHub OAuth App at:
#   GitHub → Settings → Developer settings → OAuth Apps → New OAuth App
#
# Fill in:
#   Homepage URL:     https://sojuallen.github.io/roy_website
#   Callback URL:     https://sojuallen.github.io/roy_website/admin
#
# Then update the config below and replace admin/index.html with
# the Decap CMS version (see README).

backend:
  name: github
  repo: sojuallen/roy_website
  branch: main

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "data"
    label: "Timeline Data"
    files:
      - name: "entries"
        label: "Timeline Entries"
        file: "data/entries.json"
        fields:
          - name: "entries"
            label: "Entries"
            widget: "list"
            summary: "{{type | upper}}: {{title}} — {{date}}"
            fields:
              - label: "Type"
                name: "type"
                widget: "select"
                options:
                  - { label: "Book", value: "book" }
                  - { label: "Event", value: "event" }
              - label: "Date"
                name: "date"
                widget: "date"
                format: "YYYY-MM-DD"
              - label: "Title"
                name: "title"
                widget: "string"
              - label: "Cover Image (books only)"
                name: "coverImage"
                widget: "image"
                required: false
              - label: "Event Icon (events only)"
                name: "icon"
                widget: "image"
                required: false
              - label: "Details"
                name: "details"
                widget: "markdown"
                required: false
