<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Roy's Learning Journey</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="side-timeline" id="side-timeline">
    <div class="side-line"></div>
    <div class="side-dots" id="side-dots"></div>
    <div class="side-highlight" id="side-highlight"></div>
    <div class="side-tooltip" id="side-tooltip"></div>
  </div>

  <div class="bg-stars" id="bg-stars"></div>

  <div class="main-content">
    <section class="hero">
      <div class="hero-stars">
        <span class="star star-s star-yellow" style="top:6%;left:3%;animation-delay:0s"></span>
        <span class="star star-m star-white" style="top:14%;left:10%;animation-delay:0.3s"></span>
        <span class="star star-s star-blue" style="top:8%;left:22%;animation-delay:0.8s"></span>
        <span class="star star-lg star-gold" style="top:25%;left:5%;animation-delay:0.5s"></span>
        <span class="star star-m star-white" style="top:18%;left:35%;animation-delay:0.2s"></span>
        <span class="star star-s star-yellow" style="top:5%;left:50%;animation-delay:1.1s"></span>
        <span class="star star-lg star-blue" style="top:22%;left:65%;animation-delay:0.7s"></span>
        <span class="star star-m star-gold" style="top:10%;left:78%;animation-delay:0.4s"></span>
        <span class="star star-s star-white" style="top:30%;left:85%;animation-delay:1.4s"></span>
        <span class="star star-s star-yellow" style="top:12%;left:40%;animation-delay:1.6s"></span>
        <span class="star star-m star-blue" style="top:5%;left:92%;animation-delay:0.9s"></span>
      </div>

      <svg class="hero-planet hero-saturn" viewBox="0 0 140 100" xmlns="http://www.w3.org/2000/svg">
        <ellipse cx="70" cy="40" rx="40" ry="38" fill="#f0a050"/>
        <ellipse cx="70" cy="40" rx="40" ry="38" fill="url(#saturnGrad1)"/>
        <ellipse cx="50" cy="28" rx="12" ry="6" fill="rgba(255,255,255,0.15)" transform="rotate(-15,50,28)"/>
        <ellipse cx="80" cy="50" rx="8" ry="4" fill="rgba(255,255,255,0.1)" transform="rotate(-15,80,50)"/>
        <ellipse cx="70" cy="40" rx="65" ry="12" fill="none" stroke="#e8c88a" stroke-width="5" transform="rotate(-18,70,40)"/>
        <ellipse cx="55" cy="48" rx="58" ry="9" fill="none" stroke="#d4a864" stroke-width="3" transform="rotate(-18,55,48)" opacity="0.5"/>
        <defs>
          <radialGradient id="saturnGrad1">
            <stop offset="0%" stop-color="rgba(255,255,255,0.2)"/>
            <stop offset="100%" stop-color="rgba(0,0,0,0.1)"/>
          </radialGradient>
        </defs>
      </svg>

      <svg class="hero-planet hero-mars" viewBox="0 0 60 60" xmlns="http://www.w3.org/2000/svg">
        <circle cx="30" cy="30" r="28" fill="#d44c3a"/>
        <circle cx="30" cy="30" r="28" fill="url(#marsGrad)"/>
        <circle cx="22" cy="20" r="5" fill="rgba(255,255,255,0.12)"/>
        <circle cx="38" cy="38" r="3" fill="rgba(0,0,0,0.1)"/>
        <defs>
          <radialGradient id="marsGrad">
            <stop offset="0%" stop-color="rgba(255,200,150,0.3)"/>
            <stop offset="100%" stop-color="rgba(0,0,0,0.15)"/>
          </radialGradient>
        </defs>
      </svg>

      <svg class="hero-planet hero-neptune" viewBox="0 0 50 50" xmlns="http://www.w3.org/2000/svg">
        <circle cx="25" cy="25" r="24" fill="#4a90d9"/>
        <circle cx="25" cy="25" r="24" fill="url(#nepGrad)"/>
        <circle cx="18" cy="18" r="4" fill="rgba(255,255,255,0.15)"/>
        <defs>
          <radialGradient id="nepGrad">
            <stop offset="0%" stop-color="rgba(180,220,255,0.4)"/>
            <stop offset="100%" stop-color="rgba(0,0,50,0.2)"/>
          </radialGradient>
        </defs>
      </svg>

      <div class="shooting-stars">
        <span class="shooting-star" style="top:10%;left:20%;animation-delay:0s"></span>
        <span class="shooting-star" style="top:25%;left:50%;animation-delay:4s"></span>
        <span class="shooting-star" style="top:5%;left:70%;animation-delay:8s"></span>
      </div>

      <svg class="hero-rocket hero-rocket-1" viewBox="0 0 80 130" xmlns="http://www.w3.org/2000/svg">
        <path d="M40 0 C40 15 52 40 55 52 L55 88 L40 95 L25 88 L25 52 C28 40 40 15 40 0Z" fill="#ff6b6b"/>
        <path d="M40 0 C40 15 28 40 25 52 L25 88 L40 95 L55 88 L55 52 C52 40 40 15 40 0Z" fill="#ff8e8e"/>
        <circle cx="40" cy="58" r="9" fill="white" stroke="#ff6b6b" stroke-width="1.5"/>
        <circle cx="40" cy="58" r="5" fill="#2c3e50"/>
        <circle cx="42" cy="55" r="2" fill="white" opacity="0.7"/>
        <path d="M25 72 L9 96 L25 84 Z" fill="#ff6b6b"/>
        <path d="M55 72 L71 96 L55 84 Z" fill="#ff6b6b"/>
        <path d="M28 90 Q40 140 40 140 Q40 140 52 90" fill="#ffcc44" opacity="0.9"/>
        <path d="M33 90 Q40 125 40 125 Q40 125 47 90" fill="#ff7733" opacity="0.85"/>
      </svg>

      <svg class="hero-rocket hero-rocket-2" viewBox="0 0 60 100" xmlns="http://www.w3.org/2000/svg">
        <path d="M30 0 C30 12 40 35 42 45 L42 72 L30 78 L18 72 L18 45 C20 35 30 12 30 0Z" fill="#5b8cbd"/>
        <path d="M30 0 C30 12 20 35 18 45 L18 72 L30 78 L42 72 L42 45 C40 35 30 12 30 0Z" fill="#7db8e8"/>
        <circle cx="30" cy="48" r="7" fill="white" stroke="#5b8cbd" stroke-width="1.5"/>
        <circle cx="30" cy="48" r="4" fill="#2c3e50"/>
        <path d="M18 60 L5 78 L18 70 Z" fill="#e8913a"/>
        <path d="M42 60 L55 78 L42 70 Z" fill="#e8913a"/>
        <path d="M22 72 Q30 100 30 100 Q30 100 38 72" fill="#ffcc44" opacity="0.85"/>
        <path d="M26 72 Q30 92 30 92 Q30 92 34 72" fill="#ff7733" opacity="0.8"/>
      </svg>

      <header class="profile">
        <div class="profile-card">
          <div class="profile-avatar">
            <img src="images/profile.jpg" alt="Roy" onerror="this.style.display='none';this.nextElementSibling.style.display='flex';">
            <div class="avatar-fallback" style="display:none;">
              <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                <circle cx="50" cy="50" r="50" fill="#1a1a3e"/>
                <circle cx="25" cy="18" r="1.5" fill="white"/>
                <circle cx="72" cy="12" r="1.2" fill="white"/>
                <circle cx="80" cy="35" r="1" fill="white" opacity="0.7"/>
                <path d="M50 80 L37 48 L37 62 L50 68 L63 62 L63 48Z" fill="#ff8e8e"/>
                <circle cx="50" cy="55" r="9" fill="white"/>
                <circle cx="50" cy="55" r="5.5" fill="#1a1a3e"/>
                <path d="M42 76 Q50 96 50 96 Q50 96 58 76" fill="#ffcc44"/>
                <path d="M45 76 Q50 90 50 90 Q50 90 55 76" fill="#ff7733"/>
              </svg>
            </div>
          </div>
          <div class="profile-info">
            <h1>Roy's Learning Journey</h1>
            <p class="profile-bio">
              Welcome aboard, astronaut! This is Roy's mission log — tracking every
              book discovered and every milestone reached as he explores the universe
              of knowledge. Ready for launch?
            </p>
          </div>
        </div>
      </header>
    </section>

    <div class="stats-bar" id="stats-bar">
      <div class="stat stat-books">
        <span class="stat-num" id="stat-books">0</span>
        <span class="stat-label">📚 Books</span>
      </div>
      <div class="stat stat-events">
        <span class="stat-num" id="stat-events">0</span>
        <span class="stat-label">🏆 Events</span>
      </div>
      <div class="stat stat-total">
        <span class="stat-num" id="stat-total">0</span>
        <span class="stat-label">🚀 Total</span>
      </div>
    </div>

    <main class="timeline-wrapper" id="timeline-wrapper">
      <svg id="timeline-svg" xmlns="http://www.w3.org/2000/svg"></svg>
      <div id="tiles-layer" class="tiles-layer"></div>
    </main>

    <footer class="site-footer">
      <p>Made with &#9829; for Roy</p>
    </footer>
  </div>

  <div class="scroll-hint" id="scroll-hint">
    <span>keep exploring</span>
    <div class="scroll-arrow"></div>
  </div>

  <div class="modal-overlay" id="modal-overlay">
    <div class="modal-content">
      <button class="modal-close" id="modal-close">&times;</button>
      <div class="modal-body" id="modal-body"></div>
    </div>
  </div>

  <script src="js/modal.js"></script>
  <script src="js/timeline.js"></script>
</body>
</html>
